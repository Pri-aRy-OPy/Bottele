<!DOCTYPE html>
<html lang="id">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1"
>

<title>Cloupanz Admin</title>

<style>

* {
  box-sizing: border-box;
}

body {

  margin: 0;

  min-height: 100vh;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

  color: white;

  background:
    radial-gradient(
      circle at top,
      #24113e,
      #090711 55%,
      #050509
    );

}

.hidden {
  display: none !important;
}

/* =========================================
   LOGIN
========================================= */

#loginPage {

  min-height: 100vh;

  display: flex;

  align-items: center;

  justify-content: center;

  padding: 20px;

}

.login-card {

  width: 100%;

  max-width: 460px;

  padding: 42px 30px;

  border-radius: 28px;

  background:
    rgba(18, 16, 28, .92);

  border:
    1px solid
    rgba(255,255,255,.10);

  box-shadow:
    0 30px 80px
    rgba(0,0,0,.55);

  text-align: center;

}

.logo {

  width: 110px;

  height: 110px;

  margin:
    0 auto 24px;

  display: flex;

  align-items: center;

  justify-content: center;

  border-radius: 30px;

  font-size: 52px;

  background:
    linear-gradient(
      135deg,
      #a855f7,
      #6d28d9
    );

  box-shadow:
    0 15px 45px
    rgba(139,92,246,.35);

}

.login-card h1 {

  margin: 0;

  font-size: 34px;

}

.subtitle {

  margin:
    8px 0 30px;

  color: #a7a3b5;

  font-size: 16px;

}

.pin-box {

  position: relative;

}

#pinInput {

  width: 100%;

  padding:
    18px 55px 18px 20px;

  border-radius: 18px;

  border:
    1px solid
    rgba(255,255,255,.10);

  outline: none;

  background: #0c0a10;

  color: white;

  font-size: 18px;

}

#pinInput:focus {

  border-color: #a855f7;

  box-shadow:
    0 0 0 3px
    rgba(168,85,247,.15);

}

.eye {

  position: absolute;

  right: 18px;

  top: 50%;

  transform:
    translateY(-50%);

  border: 0;

  background: transparent;

  color: white;

  font-size: 22px;

  cursor: pointer;

}

#loginButton {

  width: 100%;

  margin-top: 18px;

  padding: 17px;

  border: 0;

  border-radius: 18px;

  color: white;

  background:
    linear-gradient(
      135deg,
      #a855f7,
      #7c3aed
    );

  font-size: 17px;

  font-weight: bold;

  cursor: pointer;

}

#loginButton:disabled {

  opacity: .65;

  cursor: wait;

}

#loginError {

  min-height: 24px;

  margin-top: 15px;

  color: #fb7185;

  font-size: 14px;

}

/* =========================================
   APP
========================================= */

#app {

  min-height: 100vh;

  padding: 20px;

}

.container {

  width: 100%;

  max-width: 1100px;

  margin: auto;

}

header {

  display: flex;

  align-items: center;

  justify-content: space-between;

  gap: 15px;

  margin-bottom: 25px;

}

header h1 {

  margin: 0;

  font-size: 27px;

}

.label {

  margin-top: 5px;

  color: #9993aa;

}

.actions {

  display: flex;

  gap: 10px;

}

button {

  cursor: pointer;

}

.refresh,
.logout {

  border: 0;

  padding: 12px 16px;

  border-radius: 12px;

  color: white;

  font-weight: bold;

}

.refresh {

  background: #7c3aed;

}

.logout {

  background: #3f3f46;

}

/* =========================================
   STATS
========================================= */

.stats {

  display: grid;

  grid-template-columns:
    repeat(3,1fr);

  gap: 15px;

  margin-bottom: 20px;

}

.card {

  padding: 22px;

  border-radius: 18px;

  background:
    rgba(24,21,35,.9);

  border:
    1px solid
    rgba(255,255,255,.08);

}

.card-label {

  color: #9f9aac;

  font-size: 14px;

}

.number {

  margin-top: 8px;

  font-size: 30px;

  font-weight: bold;

}

/* =========================================
   TABLE
========================================= */

.table-box {

  overflow-x: auto;

  border-radius: 18px;

  background:
    rgba(24,21,35,.9);

  border:
    1px solid
    rgba(255,255,255,.08);

}

table {

  width: 100%;

  border-collapse:
    collapse;

  min-width: 650px;

}

th,
td {

  padding: 15px;

  text-align: left;

  border-bottom:
    1px solid
    rgba(255,255,255,.07);

}

th {

  color: #9f9aac;

  font-size: 13px;

}

.empty {

  padding: 40px;

  text-align: center;

  color: #8d8799;

}

.status {

  display: inline-block;

  padding:
    6px 10px;

  border-radius: 20px;

  background: #14532d;

  color: #86efac;

  font-size: 12px;

}

/* =========================================
   MOBILE
========================================= */

@media(max-width:700px) {

  .stats {

    grid-template-columns: 1fr;

  }

  header {

    align-items: flex-start;

    flex-direction: column;

  }

  .actions {

    width: 100%;

  }

  .refresh,
  .logout {

    flex: 1;

  }

  .login-card {

    padding: 35px 20px;

  }

}

</style>

</head>

<body>

<!-- ========================================
     LOGIN
======================================== -->

<section id="loginPage">

  <div class="login-card">

    <div class="logo">
      ☁️
    </div>

    <h1>
      Cloupanz
    </h1>

    <div class="subtitle">
      Admin Control Panel
    </div>

    <div class="pin-box">

      <input
        id="pinInput"
        type="password"
        placeholder="Masukkan PIN admin"
        autocomplete="off"
      >

      <button
        class="eye"
        type="button"
        onclick="togglePin()"
      >
        👁️
      </button>

    </div>

    <button
      id="loginButton"
      type="button"
      onclick="login()"
    >
      Masuk
    </button>

    <div id="loginError"></div>

  </div>

</section>


<!-- ========================================
     APP
======================================== -->

<section
  id="app"
  class="hidden"
>

<div class="container">

  <header>

    <div>

      <h1>
        🤖 Cloupanz Dashboard
      </h1>

      <div class="label">
        Telegram Downloader
      </div>

    </div>

    <div class="actions">

      <button
        class="refresh"
        onclick="loadUsers()"
      >
        🔄 Refresh
      </button>

      <button
        class="logout"
        onclick="logout()"
      >
        Keluar
      </button>

    </div>

  </header>


  <div class="stats">

    <div class="card">

      <div class="card-label">
        Total User
      </div>

      <div
        class="number"
        id="totalUsers"
      >
        0
      </div>

    </div>


    <div class="card">

      <div class="card-label">
        Aktif Hari Ini
      </div>

      <div
        class="number"
        id="todayUsers"
      >
        0
      </div>

    </div>


    <div class="card">

      <div class="card-label">
        Status
      </div>

      <div class="number">

        <span class="status">
          ONLINE
        </span>

      </div>

    </div>

  </div>


  <div class="table-box">

    <table>

      <thead>

        <tr>

          <th>
            User
          </th>

          <th>
            Telegram ID
          </th>

          <th>
            Nama
          </th>

          <th>
            Terakhir Aktif
          </th>

        </tr>

      </thead>

      <tbody id="users">

        <tr>

          <td
            colspan="4"
            class="empty"
          >
            Memuat data...
          </td>

        </tr>

      </tbody>

    </table>

  </div>

</div>

</section>


<script>

/* =========================================
   SESSION
========================================= */

const SESSION_KEY =
  "cloupanz_admin_token";


/* =========================================
   LOGIN
========================================= */

async function login() {

  const input =
    document.getElementById(
      "pinInput"
    );

  const button =
    document.getElementById(
      "loginButton"
    );

  const error =
    document.getElementById(
      "loginError"
    );

  const pin =
    input.value.trim();

  error.textContent = "";

  if (!pin) {

    error.textContent =
      "Masukkan PIN terlebih dahulu.";

    return;
  }

  button.disabled = true;

  button.textContent =
    "Memeriksa...";

  try {

    const controller =
      new AbortController();

    const timeout =
      setTimeout(
        () => controller.abort(),
        10000
      );

    const response =
      await fetch(
        "/api/admin",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              pin
            }),

          signal:
            controller.signal
        }
      );

    clearTimeout(timeout);

    let data;

    try {

      data =
        await response.json();

    } catch {

      throw new Error(
        "Server memberikan respons tidak valid."
      );
    }

    if (!response.ok || !data.ok) {

      throw new Error(
        data.message ||
        "PIN salah."
      );
    }

    sessionStorage.setItem(
      SESSION_KEY,
      data.token
    );

    input.value = "";

    showApp();

    await loadUsers();

  } catch (err) {

    console.error(err);

    if (
      err.name ===
      "AbortError"
    ) {

      error.textContent =
        "Server terlalu lama merespons.";

    } else {

      error.textContent =
        err.message ||
        "Gagal login.";

    }

  } finally {

    button.disabled = false;

    button.textContent =
      "Masuk";

  }

}


/* =========================================
   SESSION CHECK
========================================= */

async function checkSession() {

  const token =
    sessionStorage.getItem(
      SESSION_KEY
    );

  if (!token) {

    showLogin();

    return;

  }

  try {

    const response =
      await fetch(
        "/api/admin",
        {
          headers: {
            Authorization:
              `Bearer ${token}`
          }
        }
      );

    if (!response.ok) {

      throw new Error(
        "Session expired."
      );

    }

    showApp();

    await loadUsers();

  } catch {

    sessionStorage.removeItem(
      SESSION_KEY
    );

    showLogin();

  }

}


/* =========================================
   SHOW LOGIN
========================================= */

function showLogin() {

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

}


/* =========================================
   SHOW APP
========================================= */

function showApp() {

  document
    .getElementById("loginPage")
    .classList.add("hidden");

  document
    .getElementById("app")
    .classList.remove("hidden");

}


/* =========================================
   LOAD USERS
========================================= */

async function loadUsers() {

  const tbody =
    document.getElementById(
      "users"
    );

  const token =
    sessionStorage.getItem(
      SESSION_KEY
    );

  if (!token) {

    showLogin();

    return;

  }

  tbody.innerHTML = `
    <tr>
      <td
        colspan="4"
        class="empty"
      >
        Memuat data...
      </td>
    </tr>
  `;

  try {

    const response =
      await fetch(
        "/api/admin",
        {
          method: "GET",

          headers: {
            Authorization:
              `Bearer ${token}`
          }
        }
      );

    const data =
      await response.json();

    if (
      response.status === 401
    ) {

      logout();

      return;

    }

    if (
      !response.ok ||
      !data.ok
    ) {

      throw new Error(
        data.message ||
        "Gagal mengambil data."
      );

    }

    const documents =
      data.users || [];

    document
      .getElementById(
        "totalUsers"
      )
      .textContent =
        documents.length;

    const now =
      new Date();

    let today = 0;

    tbody.innerHTML = "";

    if (!documents.length) {

      tbody.innerHTML = `
        <tr>
          <td
            colspan="4"
            class="empty"
          >
            Belum ada user.
          </td>
        </tr>
      `;

      document
        .getElementById(
          "todayUsers"
        )
        .textContent = "0";

      return;

    }

    documents.forEach(
      doc => {

        const f =
          doc.fields || {};

        const username =
          f.username?.stringValue ||
          "-";

        const id =
          f.telegram_id?.stringValue ||
          "-";

        const first =
          f.first_name?.stringValue ||
          "";

        const last =
          f.last_name?.stringValue ||
          "";

        const name =
          `${first} ${last}`
            .trim() || "-";

        const timestamp =
          f.last_seen?.timestampValue ||
          "";

        const date =
          timestamp
            ? new Date(timestamp)
            : null;

        if (
          date &&
          date.toDateString() ===
          now.toDateString()
        ) {

          today++;

        }

        const tr =
          document.createElement(
            "tr"
          );

        tr.innerHTML = `

          <td>
            @${escapeHtml(username)}
          </td>

          <td>
            ${escapeHtml(id)}
          </td>

          <td>
            ${escapeHtml(name)}
          </td>

          <td>
            ${
              date
                ? date.toLocaleString(
                    "id-ID"
                  )
                : "-"
            }
          </td>

        `;

        tbody.appendChild(tr);

      }
    );

    document
      .getElementById(
        "todayUsers"
      )
      .textContent =
        today;

  } catch (error) {

    console.error(error);

    tbody.innerHTML = `

      <tr>

        <td
          colspan="4"
          class="empty"
        >

          ❌
          ${escapeHtml(
            error.message ||
            "Gagal mengambil data."
          )}

        </td>

      </tr>

    `;

  }

}


/* =========================================
   LOGOUT
========================================= */

function logout() {

  sessionStorage.removeItem(
    SESSION_KEY
  );

  document
    .getElementById("app")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document
    .getElementById("pinInput")
    .value = "";

}


/* =========================================
   TOGGLE PIN
========================================= */

function togglePin() {

  const input =
    document.getElementById(
      "pinInput"
    );

  input.type =
    input.type === "password"
      ? "text"
      : "password";

}


/* =========================================
   ESCAPE HTML
========================================= */

function escapeHtml(value) {

  return String(value ?? "")
    .replaceAll(
      "&",
      "&amp;"
    )
    .replaceAll(
      "<",
      "&lt;"
    )
    .replaceAll(
      ">",
      "&gt;"
    )
    .replaceAll(
      '"',
      "&quot;"
    )
    .replaceAll(
      "'",
      "&#039;"
    );

}


/* =========================================
   ENTER
========================================= */

document
  .getElementById("pinInput")
  .addEventListener(
    "keydown",
    event => {

      if (
        event.key === "Enter"
      ) {

        login();

      }

    }
  );


/* =========================================
   START
========================================= */

checkSession();

</script>

</body>
</html>
